workflows:
  ios-unsigned-ci:
    name: iOS unsigned CI
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - app/ios/Pods
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get
      - name: Analyze
        working_directory: app
        script: flutter analyze
      - name: Test
        working_directory: app
        script: flutter test
      - name: Resolve iOS packages
        working_directory: app/ios
        script: xcodebuild -resolvePackageDependencies -workspace Runner.xcworkspace -scheme Runner
      - name: Build iOS simulator
        working_directory: app
        script: flutter build ios --simulator --debug
      - name: Build iOS device without signing
        working_directory: app
        script: flutter build ios --debug --no-codesign
    artifacts:
      - app/build/ios/**/*.app
      - app/build/ios/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
